name: SonarCloud

on:
  workflow_call:
    inputs:
      project-key:
        description: "SonarCloud project key (defaults to storytold_<repo>)"
        type: string
        required: false
        default: ""
      fonts-ref:
        description: "craft-fonts commit for tests that lay out text (empty skips the checkout)"
        type: string
        required: false
        default: ""
      timeout-minutes:
        description: "Maximum job runtime, including coverage generation and the scan"
        type: number
        required: false
        default: 90
      shards:
        description: >-
          Split the Rust coverage run into this many parallel cargo-nextest partitions
          (1 keeps the single `cargo llvm-cov` job). Doctests are not run when sharded.
        type: number
        required: false
        default: 1
    secrets:
      SONAR_TOKEN:
        description: "SonarCloud analysis token"
        required: false

permissions:
  contents: read

env:
  COVERAGE_IGNORE: '(^|/)(vendor|xtask)/'

jobs:
  plan:
    name: Plan coverage shards
    if: inputs.shards > 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build shard matrix
        id: matrix
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SHARDS: ${{ inputs.shards }}
        run: |
          # Same gate as the scan job: no token or no Rust workspace means no coverage to shard.
          if [ -n "$SONAR_TOKEN" ] && [ -f Cargo.toml ]; then
            echo "matrix={\"shard\":[$(seq -s, 1 "$SHARDS")]}" >>"$GITHUB_OUTPUT"
          else
            echo 'matrix={"shard":[]}' >>"$GITHUB_OUTPUT"
          fi

  coverage:
    name: Coverage ${{ matrix.shard }}/${{ inputs.shards }}
    needs: plan
    if: needs.plan.outputs.matrix != '{"shard":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ inputs.fonts-ref }}
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install Linux build dependencies
        uses: storytold/craft-common-actions/actions/install-apt-packages@main
        with:
          packages: >-
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libasound2-dev
            libgl1-mesa-dev mesa-vulkan-drivers
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Every shard builds the same instrumented targets, so they share one cache entry.
          shared-key: sonar-coverage
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}
      - name: Generate Rust coverage for this shard
        # A red test must not hide the static analysis, so keep going and scan what was measured.
        continue-on-error: true
        env:
          CARGO_TERM_COLOR: always
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: >
          cargo llvm-cov nextest --workspace --partition count:${{ matrix.shard }}/${{ inputs.shards }}
          --no-fail-fast --ignore-run-fail --lcov --output-path lcov-${{ matrix.shard }}.info
          --ignore-filename-regex "$COVERAGE_IGNORE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-${{ matrix.shard }}
          path: lcov-${{ matrix.shard }}.info
          if-no-files-found: ignore
          retention-days: 1

  sonarcloud:
    name: SonarCloud Scan
    needs: coverage
    # Scan even if a shard failed outright; the plan/coverage jobs are skipped when shards is 1.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for SonarCloud token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >>"$GITHUB_OUTPUT"
          else
            echo "available=false" >>"$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN is not available (e.g. a fork pull request); skipping SonarCloud scan."
          fi
      - name: Validate SonarCloud project key
        id: project
        if: steps.token.outputs.available == 'true'
        shell: bash
        env:
          PROJECT_KEY: ${{ inputs.project-key != '' && inputs.project-key || format('storytold_{0}', github.event.repository.name) }}
          LC_ALL: C
        run: |
          # The scan action splits args; reject characters that could introduce properties.
          if [[ ! "$PROJECT_KEY" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.:-]*$ || ${#PROJECT_KEY} -gt 400 ]]; then
            echo "::error::Invalid SonarCloud project key: must start with an alphanumeric character or underscore and contain only letters, digits, dash, underscore, period or colon (max 400 characters)."
            exit 1
          fi
          printf 'key=%s\n' "$PROJECT_KEY" >>"$GITHUB_OUTPUT"
      - name: Check out craft-fonts
        if: steps.token.outputs.available == 'true'
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ inputs.fonts-ref }}
      - name: Free disk space
        # The instrumented workspace build overflows the ~14 GB free on a stock runner.
        if: steps.token.outputs.available == 'true' && hashFiles('Cargo.toml') != ''
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install Linux build dependencies
        if: steps.token.outputs.available == 'true' && hashFiles('Cargo.toml') != '' && inputs.shards <= 1
        uses: storytold/craft-common-actions/actions/install-apt-packages@main
        with:
          packages: >-
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libasound2-dev
            libgl1-mesa-dev mesa-vulkan-drivers
      - name: Install Rust and cargo-llvm-cov
        if: steps.token.outputs.available == 'true' && hashFiles('Cargo.toml') != '' && inputs.shards <= 1
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        if: steps.token.outputs.available == 'true' && hashFiles('Cargo.toml') != '' && inputs.shards <= 1
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.token.outputs.available == 'true' && hashFiles('Cargo.toml') != '' && inputs.shards <= 1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Generate Rust coverage
        id: coverage
        if: steps.token.outputs.available == 'true' && hashFiles('Cargo.toml') != '' && inputs.shards <= 1
        # A red test must not hide the static analysis, so keep going and scan what was measured.
        continue-on-error: true
        env:
          CARGO_TERM_COLOR: always
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          # Coverage comes from instrumentation, not DWARF; debuginfo is most of target/.
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: >
          cargo llvm-cov --workspace --ignore-run-fail --lcov --output-path lcov.info
          --ignore-filename-regex "$COVERAGE_IGNORE"
      - name: Merge shard coverage
        if: steps.token.outputs.available == 'true' && inputs.shards > 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lcov-*
          path: lcov-shards
          merge-multiple: true
      - name: Combine shard reports
        if: steps.token.outputs.available == 'true' && inputs.shards > 1
        run: |
          # lcov sums hit counts for the same line across shards; a shard that never ran adds nothing.
          sudo apt-get install -y --no-install-recommends lcov
          set -- lcov-shards/lcov-*.info
          [ -e "$1" ] || exit 0
          lcov "${@/#/-a}" -o lcov.info 2>&1 | tail -3
      - name: SonarCloud Scan
        if: steps.token.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            "-Dsonar.projectKey=${{ steps.project.outputs.key }}"
            -Dsonar.organization=storytold
            -Dsonar.rust.lcov.reportPaths=lcov.info
