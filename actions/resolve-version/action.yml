name: "Resolve version"
description: "Resolves, validates, and outputs the release version and date"

inputs:
  input-version:
    description: "Version override (optional, e.g. 0.2.0-rc.1)"
    required: false
    default: ""
  app-title:
    description: "Application display name for the job summary"
    required: false
    default: "Craft App"

outputs:
  version:
    description: "Resolved semver string without 'v' prefix"
    value: ${{ steps.resolve.outputs.version }}
  date:
    description: "Build date formatted as YYYY-MM-DD"
    value: ${{ steps.resolve.outputs.date }}
  prerelease:
    description: "Boolean indicating if the version is a prerelease"
    value: ${{ steps.resolve.outputs.prerelease }}

runs:
  using: "composite"
  steps:
    - id: resolve
      name: Resolve version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.input-version }}
        APP_TITLE: ${{ inputs.app-title }}
      run: |
        # Reject newlines or carriage returns upfront to prevent output-file protocol forgery
        if [[ "$INPUT_VERSION" =~ [$'\r\n'] ]]; then
          echo "::error::input-version must not contain carriage returns or newlines"
          exit 1
        fi
        if [ -f packaging/env.sh ]; then
          . packaging/env.sh
        elif [ -f packaging/common.sh ]; then
          . packaging/common.sh
        fi
        v="$INPUT_VERSION"
        v="${v#v}"
        v="${v:-${VERSION:-}}"
        if [[ "$v" =~ [$'\r\n'] ]]; then
          echo "::error::version must not contain carriage returns or newlines"
          exit 1
        fi
        # Whole-string match against semver grammar
        semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
        if [[ ! "$v" =~ $semver ]]; then
          echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-rc.1"
          exit 1
        fi
        case "$v" in *-*) pre=true ;; *) pre=false ;; esac
        build_date="$(date -u +%Y-%m-%d)"
        if [[ ! "$build_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
          echo "::error::generated build date '$build_date' is not valid YYYY-MM-DD"
          exit 1
        fi
        {
          echo "version=$v"
          echo "date=$build_date"
          echo "prerelease=$pre"
        } >>"$GITHUB_OUTPUT"
        clean_title="${APP_TITLE//$'\r'/}"
        clean_title="${clean_title//$'\n'/ }"
        printf '### %s v%s (`%s`)\n' "$clean_title" "$v" "${GITHUB_SHA::9}" >>"$GITHUB_STEP_SUMMARY"
